{{- if .Values.rbacHelpers.enable }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "aws-accesskey-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "aws-accesskey-operator.resourceName" (dict "suffix" "iamprovidergrant-viewer-role" "context" $) }}
rules:
- apiGroups:
  - aws-accesskey-operator.lightjack.de
  resources:
  - iamprovidergrants
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - aws-accesskey-operator.lightjack.de
  resources:
  - iamprovidergrants/status
  verbs:
  - get
{{- end }}

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aws-accesskey-operator.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - update
  - watch
- apiGroups:
  - aws-accesskey-operator.lightjack.de
  resources:
  - iamaccesskeys
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - aws-accesskey-operator.lightjack.de
  resources:
  - iamaccesskeys/finalizers
  verbs:
  - update
- apiGroups:
  - aws-accesskey-operator.lightjack.de
  resources:
  - iamaccesskeys/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - aws-accesskey-operator.lightjack.de
  resources:
  - iamproviderconfigs
  - iamprovidergrants
  verbs:
  - get
  - list
  - watch

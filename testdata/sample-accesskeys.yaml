apiVersion: aws-accesskey-operator.lightjack.de/v1alpha1
kind: IAMAccessKey
metadata:
  name: foo-accesskey
  namespace: aws-accesskey-operator-system
spec:
  providerConfigRef:
    name: seaweedfs
    namespace: aws-accesskey-operator-system
  username: foo
  secretName: foo-aws-credentials
  secretField: creds

# This rule is not used by the project aws-accesskey-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over aws-accesskey-operator.lightjack.de.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: aws-accesskey-operator
    app.kubernetes.io/managed-by: kustomize
  name: iamaccesskey-admin-role
rules:
- apiGroups:
  - aws-accesskey-operator.lightjack.de
  resources:
  - iamaccesskeys
  verbs:
  - '*'
- apiGroups:
  - aws-accesskey-operator.lightjack.de
  resources:
  - iamaccesskeys/status
  verbs:
  - get
